name: Pak Test Suite

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Pak compiler
        run: pip install -e ".[dev]"

      - name: Verify pak CLI is available
        run: pak --version

      # ── Correctness ──────────────────────────────────────────────────────────

      - name: Run unit + integration tests
        run: pytest tests/ -v --tb=short

      # ── Canonical examples ────────────────────────────────────────────────────

      - name: Verify all canonical examples pass pak check
        run: |
          failed=0
          for f in examples/canonical/*.pak; do
            if ! pak check "$f" > /dev/null 2>&1; then
              echo "FAIL: $f"
              pak check "$f"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] && echo "All canonical examples passed."
          exit $failed

      - name: Verify all invalid test examples fail pak check
        run: |
          failed=0
          for f in tests/invalid/*.pak; do
            if pak check "$f" > /dev/null 2>&1; then
              echo "FAIL (should have failed): $f"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] && echo "All invalid examples correctly failed."
          exit $failed

      # ── Golden snapshots ─────────────────────────────────────────────────────

      - name: Check pak explain snapshots are up to date
        run: |
          failed=0
          for f in examples/canonical/*.pak; do
            name=$(basename "$f" .pak)
            snapshot="tests/snapshots/${name}.c"
            if [ ! -f "$snapshot" ]; then
              echo "MISSING SNAPSHOT: $snapshot"
              failed=1
              continue
            fi
            actual=$(pak explain "$f" 2>/dev/null)
            expected=$(cat "$snapshot")
            if [ "$actual" != "$expected" ]; then
              echo "SNAPSHOT DRIFT: $f"
              diff <(echo "$expected") <(echo "$actual") | head -20
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] && echo "All snapshots match."
          exit $failed

      # ── Style / lint ──────────────────────────────────────────────────────────

      - name: Check for Python syntax errors in tools/
        run: python3 -m py_compile tools/pak_hook.py

      - name: Verify validate_pak.sh is executable
        run: test -x tools/validate_pak.sh || chmod +x tools/validate_pak.sh

  # ── Tcl compiler port ────────────────────────────────────────────────────────

  tcl-port:
    name: Tcl port (parity + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tcl + tcllib
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl tcllib

      # Generated mirrors (AST schema, checker tables) must be regenerated from
      # the Python sources without drift — otherwise the Tcl port is validating
      # against a stale copy of the language.
      - name: Verify generated Tcl mirrors are up to date
        run: |
          python3 tcl/tools/gen_schema.py
          python3 tcl/tools/gen_check_tables.py
          python3 tcl/tools/gen_tc_tables.py
          python3 tcl/tools/gen_cg_tables.py
          git diff --exit-code tcl/ast_schema.tcl tcl/check_tables.tcl tcl/tc_tables.tcl tcl/cg_tables.tcl \
            || { echo "Generated Tcl mirrors are stale — run the gen_*.py scripts and commit."; exit 1; }

      - name: Lexer parity (Tcl vs Python oracle)
        run: bash tcl/tools/lex_parity.sh

      - name: Parser AST parity (Tcl vs Python oracle)
        run: bash tcl/tools/ast_parity.sh

      - name: Checker diagnostic parity (Tcl vs Python oracle)
        run: bash tcl/tools/check_parity.sh

      - name: Typechecker diagnostic parity (Tcl vs Python oracle)
        run: bash tcl/tools/tc_parity.sh

      # Codegen is ported incrementally; this asserts the files already lowered
      # stay byte-identical to the golden C (and that none regress to wrong
      # output). The committed snapshots are the oracle — they are re-verified
      # against `pak explain` in the test job, so no pak install is needed here.
      - name: Codegen C parity (ported subset, Tcl vs golden C)
        run: bash tcl/tools/cg_parity.sh

      - name: Static-lint Tcl sources (nagelfar)
        run: bash tcl/tools/lint.sh

  # ── Summary badge job ───────────────────────────────────────────────────────

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test, tcl-port]
    if: always()
    steps:
      - name: Report
        run: |
          if [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.tcl-port.result }}" = "success" ]; then
            echo "✓ All tests passed."
          else
            echo "✗ One or more tests failed."
            exit 1
          fi
