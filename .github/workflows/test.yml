name: Pak Test Suite

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  compiler:
    name: Compiler (golden + examples)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Tcl + tcllib
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl tcllib

      - name: Put pak on PATH
        run: echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Verify pak CLI is available
        run: pak --version

      # ── Golden regression suite ──────────────────────────────────────────────
      # tests/golden/ pins the output of every compiler stage across the whole
      # 588-file corpus: tokens, AST, generated C, MIPS assembly, checker and
      # typechecker diagnostics, module headers, C-to-Pak output, Makefile and
      # PakFS layout. Any change in compiler output shows up here.

      - name: Golden suite (all stages, whole corpus)
        run: tclsh tcl/tools/golden_test.tcl

      # ── Canonical examples ───────────────────────────────────────────────────

      - name: Verify all canonical examples pass pak check
        run: |
          failed=0
          for f in examples/canonical/*.pk64; do
            if ! pak check "$f" > /dev/null 2>&1; then
              echo "FAIL: $f"
              pak check "$f"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] && echo "All canonical examples passed."
          exit $failed

      - name: Verify all invalid test examples fail pak check
        run: |
          failed=0
          for f in tests/invalid/*.pk64; do
            if pak check "$f" > /dev/null 2>&1; then
              echo "FAIL (should have failed): $f"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] && echo "All invalid examples correctly failed."
          exit $failed

      # ── Golden snapshots (human-readable, per canonical example) ─────────────

      - name: Check pak explain snapshots are up to date
        run: |
          failed=0
          for f in examples/canonical/*.pk64; do
            name=$(basename "$f" .pk64)
            snapshot="tests/snapshots/${name}.c"
            if [ ! -f "$snapshot" ]; then
              echo "MISSING SNAPSHOT: $snapshot"
              failed=1
              continue
            fi
            actual=$(pak explain "$f" 2>/dev/null)
            expected=$(cat "$snapshot")
            if [ "$actual" != "$expected" ]; then
              echo "SNAPSHOT DRIFT: $f"
              diff <(echo "$expected") <(echo "$actual") | head -20
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] && echo "All snapshots match."
          exit $failed

      - name: Codegen snapshot parity (canonical examples)
        run: bash tcl/tools/cg_parity.sh

      # Snapshot parity only proves the C matches the text we checked in. This
      # runs cc over it, so C that no compiler accepts fails here instead of at
      # a user's `make`. tests/c_compile_known_broken.txt is the current floor.
      - name: Generated C compiles (cc -fsyntax-only)
        run: tclsh tcl/tools/c_compile_test.tcl

      - name: MIPS assembly snapshots (canonical examples)
        run: bash tcl/tools/mips_parity.sh

      # The step above stubs libdragon, declaring every symbol as `long sym();`
      # -- an unprototyped declaration that accepts any argument count and any
      # types. A missing header, a renamed function, the wrong arity and the
      # wrong argument types all compile clean there and fail at a user's
      # `make`; all four were live in this repo. This compiles the same
      # generated C against libdragon's real headers, pinned.
      - name: Generated C matches libdragon's real API
        run: |
          bash tools/fetch_libdragon.sh
          tclsh tcl/tools/libdragon_api_test.tcl

      # STDLIB.md's libdragon column used to be the hardcoded string "yes" for
      # all 330 entries. It was not true for 82 of them. This recomputes the
      # classification by compiling a call to every directly-lowered symbol
      # against libdragon and Tiny3D, and fails if the checked-in list drifts.
      - name: MODULE_API entries resolve where STDLIB says they do
        run: |
          bash tools/fetch_libdragon.sh
          bash tools/fetch_tiny3d.sh
          tclsh tcl/tools/libdragon_symbols.tcl

      # Everything above runs the HOST compiler, so it cannot see anything the
      # TARGET decides -- a 32-bit long where the host's is 64, struct layout,
      # alignment -- and it never links. This builds the real mips64-elf
      # toolchain and libdragon, then cross-compiles every example with
      # libdragon's own -Werror flags and takes a scaffolded project all the
      # way to a bootable .z64.
      #
      # The toolchain is ~40 minutes and 9 GB, so it is cached; the gate skips
      # cleanly when the cache is cold rather than failing.
      - name: Cache mips64-elf toolchain + libdragon
        id: n64-toolchain
        uses: actions/cache@v4
        with:
          path: /opt/pak-n64
          key: n64-toolchain-binutils2.45-gcc16.2.0-newlib4.4.0-libdragon-c4a7e119e

      - name: Build mips64-elf toolchain (cold cache only)
        if: steps.n64-toolchain.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y libgmp-dev libmpfr-dev libmpc-dev texinfo bison flex
          bash tools/build_n64_toolchain.sh /opt/pak-n64
          N64_INST=/opt/pak-n64 bash tools/build_libdragon.sh

      - name: Cross-compile and link a real ROM
        run: N64_INST=/opt/pak-n64 tclsh tcl/tools/libdragon_link_test.tcl

      # tcl/n64enc.tcl is a from-scratch MIPS assembler, and the only thing
      # that checked it was a table of encodings a human worked out by hand --
      # so a misreading of the manual was baked into both sides. This assembles
      # the same text with binutils and compares the bytes. It found four
      # encoding divergences and one silent miscompile: pseudo-instructions
      # that expand to two words were being scheduled into branch delay slots,
      # where the second word is skipped whenever the branch is taken.
      - name: MIPS encoder matches GNU as, byte for byte
        run: PATH=/opt/pak-n64/bin:$PATH tclsh tcl/tools/n64enc_gas_test.tcl

      # Same argument one stage down. tcl/n64link.tcl places sections and
      # applies R_MIPS_26/HI16/LO16/32 itself, and n64link_test.tcl checks that
      # against expectations written by the same hand. This links the same
      # objects with mips64-elf-ld and compares the whole image plus every
      # symbol address, so a relocation packed into the wrong field shows up.
      - name: Flat linker matches GNU ld, byte for byte
        run: PATH=/opt/pak-n64/bin:$PATH tclsh tcl/tools/n64link_gas_test.tcl

      # Every other simulator test runs the codegen's RECORDS from `main`, so
      # runtime/standalone/boot.S had never executed -- not the stack pointer,
      # not the .bss zero-fill, not the exception-vector install, not the
      # handoff to main -- and neither had the encoded bytes. This links the
      # image, disassembles it with objdump (the bytes Pak produced, at the
      # addresses Pak assigned), and runs it from _start.
      - name: The linked image runs from _start
        run: PATH=/opt/pak-n64/bin:$PATH tclsh tcl/tools/rom_exec_test.tcl

      # Everything above checks Pak against Pak, or against binutils -- which
      # covers the bytes, not what a console does with them. This boots the
      # finished .z64 on ares and looks at the pixels. It is also the only
      # thing that implements the PIF's boot timeout, which is what caught
      # runtime/standalone/boot.S never sending the boot-termination command:
      # the picture draws correctly for five seconds either way.
      #
      # ares is ~30 minutes to build (plus SDL3, which Ubuntu does not
      # package), so it is cached; the gate skips cleanly when the cache is
      # cold rather than failing.
      - name: Cache ares
        id: ares
        uses: actions/cache@v4
        with:
          path: /opt/pak-ares
          key: ares-master-sdl3.2.24-v1

      - name: Build ares (cold cache only)
        if: steps.ares.outputs.cache-hit != 'true'
        run: bash tools/build_ares.sh /opt/pak-ares

      - name: Standalone ROMs boot and draw on ares
        run: |
          sudo apt-get install -y xvfb imagemagick mesa-vulkan-drivers libgl1-mesa-dri
          PATH=/opt/pak-ares/bin:/opt/pak-n64/bin:$PATH tclsh tcl/tools/ares_test.tcl

      # Every diagnostic the corpus exercises is a mistake someone thought to
      # write down. This finds the ones nobody did: mutated sources that must
      # still come back as an error message with a line number rather than as
      # a Tcl stack trace. Deterministic — the seed reproduces any failure.
      - name: Front-end fuzz (mutated sources never crash the compiler)
        run: |
          # The fuzzer stops itself at DEADLINE seconds, but it can only check
          # that between mutants -- an input that wedges the compiler outright
          # (the parser used to spin forever on `.ok(1)`) would hang the job.
          # The outer timeout catches that, and current.pk64 is the input that
          # was under the compiler when the clock ran out.
          if ! timeout 300 tclsh tcl/tools/fuzz_test.tcl; then
            rc=$?
            if [ -f /tmp/pak-fuzz/current.pk64 ]; then
              echo "=== input under the compiler when it stopped ==="
              cat /tmp/pak-fuzz/current.pk64
            fi
            exit $rc
          fi

      - name: Verify validate_pak.sh is executable
        run: test -x tools/validate_pak.sh || chmod +x tools/validate_pak.sh

  # ── Toolchain-free binary path ───────────────────────────────────────────────

  binary:
    name: Binary back end (object → link → ROM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tcl + tcllib
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl tcllib

      - name: Put pak on PATH
        run: echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      # The encoder turns the codegen's structured record stream into machine
      # code with no mips64-elf-as, and the linker lays those objects out into a
      # flat RDRAM image with no mips64-elf-ld.

      - name: MIPS binary encoder (golden encodings)
        run: tclsh tcl/tools/n64enc_test.tcl

      - name: Encoded exec goldens (optimizer on records, calls + MMIO)
        run: tclsh tcl/tools/enc_exec_test.tcl

      - name: Array address-of and u8 index (sb, not scale-4 sw)
        run: tclsh tcl/tools/array_addr_test.tcl

      - name: Exception paint (sim + vector trampoline + 4 MiB ROM)
        run: tclsh tcl/tools/exception_test.tcl

      - name: EEPROM SI/PIF + PI DMA goldens
        run: tclsh tcl/tools/eeprom_test.tcl

      - name: Audio PCM (AI DACRATE/LEN/kick)
        run: tclsh tcl/tools/audio_test.tcl

      - name: Generic instantiation checking (E015/E016)
        run: tclsh tcl/tools/generic_inst_test.tcl

      - name: HAL contract (MODULE_API + standalone E010)
        run: tclsh tcl/tools/hal_check_test.tcl

      - name: STDLIB generated from MODULE_API
        run: tclsh tcl/tools/gen_stdlib.tcl --check

      - name: Flat linker + ROM packer
        run: tclsh tcl/tools/n64link_test.tcl

      # Runs the standalone runtime's own generated MIPS in the simulator and
      # asserts every RDP command word it builds, plus the DP kick and VI flip.
      # There is no emulator here, so this is what proves the hardware path.
      - name: RDP command stream (runtime executed in the MIPS simulator)
        run: tclsh tcl/tools/rdp_test.tcl

      - name: Assembler front end
        run: bash tcl/tools/n64asm_parity.sh

      # Only examples the HAL contract accepts are standalone programs; the
      # MIPS backend refuses the rest by design (dyn trait objects, libdragon-
      # only math). Same filter as link_test.tcl and mips_parity.sh.
      - name: Object generation (standalone canonical examples → .pakobj)
        run: |
          failed=0
          for f in examples/canonical/*.pk64; do
            pak check "$f" --backend mips > /dev/null 2>&1 || continue
            if ! pak objgen "$f" -o /tmp/obj.pakobj > /dev/null 2>&1; then
              echo "OBJGEN FAIL: $f"
              pak objgen "$f" -o /tmp/obj.pakobj
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] && echo "All standalone canonical examples produced object files."
          exit $failed

      # The runtime is Pak (+ a hand-written crt0), so both halves must stay
      # buildable with no MIPS toolchain present.
      # objgen succeeds on a program that references symbols nothing defines;
      # only `pak link` finds that out, and nothing ran it over the corpus.
      # tests/link_known_broken.txt is the current floor.
      - name: Canonical examples link into ROMs
        run: tclsh tcl/tools/link_test.tcl

      # Linking proves every symbol resolves; this proves the code computes the
      # right thing. Covers the constructs that used to fail at link.
      - name: Standalone execution (consts, defer, monomorphs, FixedList)
        run: tclsh tcl/tools/standalone_exec_test.tcl

      # The CHROMA nave end to end: it fits under FB0, it streams 2 KB pages
      # over the PI instead of embedding sheets, and the DP is handed
      # SET_TILE/LOAD_TILE/TRI_TEX_Z. This is the FZ "Path A" (see examples/chroma/README.md).
      - name: CHROMA nave (stream pages, draw textured tris)
        run: tclsh tcl/tools/church_test.tcl

      # `pak dlist` runs a scene against the HAL and disassembles the display
      # list it hands the DP. That is only useful if the disassembler is the
      # exact inverse of the encoders, which is what this checks: every opcode
      # the runtime can emit, decoded back to the values the driver passed.
      - name: RDP display-list disassembler (pak dlist)
        run: tclsh tcl/tools/dlist_test.tcl

      # Command words cannot tell you the RDP draws the right pixels: the lft
      # bit was inverted on all seven triangle commands for as long as the
      # goldens existed, and they matched perfectly. This renders the display
      # list on angrylion and compares against the source geometry.
      - name: Pixels (reference RDP)
        run: |
          bash tools/build_rdp_harness.sh
          tclsh tcl/tools/pixel_test.tcl

      - name: Runtime builds toolchain-free (boot.S + runtime.pk64)
        run: |
          pak asmobj runtime/standalone/boot.S       -o /tmp/boot.pakobj
          pak objgen runtime/standalone/runtime.pk64 -o /tmp/runtime.pakobj
          echo "boot + runtime assembled."

      - name: End-to-end ROM (source → .z64, no external tools)
        run: |
          cat > /tmp/mini.pk64 <<'PAK'
          entry {
              display.init(0, 2, 3, 0, 1)
              loop {
                  let fb: u32 = display.get()
                  rdpq.attach_clear(fb, 0x0000FFFF)
                  rdpq.detach_show()
              }
          }
          PAK
          pak objgen /tmp/mini.pk64 -o /tmp/mini.pakobj
          pak link /tmp/boot.pakobj /tmp/runtime.pakobj /tmp/mini.pakobj \
              -o /tmp/mini.z64 --name "PAK CI"
          test -s /tmp/mini.z64

  # ── Static lint ──────────────────────────────────────────────────────────────

  lint:
    name: Static lint (nagelfar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tcl + tcllib
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl tcllib
      - name: Static-lint Tcl sources
        run: bash tcl/tools/lint.sh

  # ── Summary badge job ───────────────────────────────────────────────────────

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [compiler, binary, lint]
    if: always()
    steps:
      - name: Report
        run: |
          if [ "${{ needs.compiler.result }}" = "success" ] \
          && [ "${{ needs.binary.result }}" = "success" ] \
          && [ "${{ needs.lint.result }}" = "success" ]; then
            echo "✓ All tests passed."
          else
            echo "✗ One or more tests failed."
            exit 1
          fi
